<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NKE.team — Навигация</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>

<body>

  <header class="header">
    <span class="header-logo">NKE.team</span>
  </header>

  <main class="content">

    <div class="floor-card">
      <div class="floor-label"><span class="floor-badge">1</span> 1 этаж</div>
      <img class="floor-img" src="1.png?v=1" alt="План 1 этажа">
    </div>

    <div class="floor-card">
      <div class="floor-label"><span class="floor-badge">2</span> 2 этаж</div>
      <img class="floor-img" src="2.png?v=1" alt="План 2 этажа">
    </div>

    <div class="floor-card">
      <div class="floor-label"><span class="floor-badge">3</span> 3 этаж</div>
      <img class="floor-img" src="3.png?v=1" alt="План 3 этажа">
    </div>

    <div class="floor-card">
      <div class="floor-label"><span class="floor-badge">4</span> 4 этаж</div>
      <img class="floor-img" src="4.png?v=1" alt="План 4 этажа">
    </div>

    <div class="floor-card">
      <div class="floor-label"><span class="floor-badge">5</span> 5 этаж</div>
      <img class="floor-img" src="5.png?v=1" alt="План 5 этажа">
    </div>

  </main>
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-link">
        <a class="nke-team-link"href="https://nke.team:8443/">Создано в Центре разработки цифровых сервисов</a>
        <span>© 2020-2026</span>
      </div>
      
    </div>
    
  </footer>
</body>

</html>
